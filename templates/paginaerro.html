<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-100 min-h-screen">

    <div class="navbar bg-[#8C8C8C] px-8">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-white"></div>
            <h1 class="text-3xl text-white font-light">NutriJoy</h1>
        </div>
    </div>

    <div class="flex justify-center py-20 px-4">

        <form action="{{url_for('verificalogin')}}" method="post" class="w-full max-w-lg">

            <h1 class="text-4xl font-semibold mb-2">
                E-mail ou senha incorretos
            </h1>

            <p class="opacity-70 mb-10">
                Tente novamente
            </p>

            <button class="btn w-full mt-12 bg-[#8C8C8C] border-[#8C8C8C] text-white hover:bg-[#7A7A7A]">
                <a href="{{ url_for('login') }}" class="w-[100%]">Ir para página de login</a>
            </button>

        </form>

    </div>

</body>

</html>
