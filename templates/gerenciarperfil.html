{% extends 'base.html' %}

{% block content %}
<h1 class="text-4xl font-semibold mb-[60px]">
    {{ current_user.name }}
</h1>
<div class="bg-[#FBF9F9] rounded-[30px] shadow-[6px_6px_4px_0] shadow-[#00000040] w-[55%] mx-auto p-[30px] flex flex-col justify-center align-center self-center">
    <form action="{{url_for('user.update_user', id_user=current_user.id)}}" method="post" class="w-full max-w-lg mx-auto">
            <div class="space-y-6">

                <div class="mb-[40px]">
                    <label class="label">
                        <span class="label-text text-black">Nome</span>
                    </label>
                    <input type="text" class="input input-bordered w-full" placeholder="{{ current_user.name }}" name="name">
                </div>
                <div class="mb-[40px]">
                    <label class="label">
                        <span class="label-text text-black">E-mail</span>
                    </label>
                    <input type="email" class="input input-bordered w-full" placeholder="{{ current_user.email }}" name="email">
                </div>
                <div class="mb-[40px]">
                    <label class="label">
                        <span class="label-text text-black">Senha</span>
                    </label>
                    <input type="password" class="input input-bordered w-full" placeholder="Digite uma nova senha" name="password">
                </div>
                <div>
                    <label class="label block">
                        <span class="label-text text-black">Alergias ou intolerâncias</span>
                    </label>
                    <div class="dropdown w-[100%]">
                    <div tabindex="0" role="button" class="input input-bordered w-[100%] cursor-pointer">{{opcao}}</div>
                    <ul tabindex="-1" class="w-[100%] dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
                        <li class="w-[100%]">
                            <div>
                                <input type="checkbox" name="alergia_intolerancia" value="leite">
                                <p>Leite</p>
                            </div>
                        </li>
                        <li class="w-[100%]">
                            <div>
                                <input type="checkbox" name="alergia_intolerancia" value="gluten">
                                <p>Glúten</p>
                            </div>
                        </li>
                        <li class="w-[100%]">
                            <div>
                                <input type="checkbox" name="alergia_intolerancia" value="ovo">
                                <p>Ovo</p>
                            </div>
                        </li>
                        <li class="w-[100%]">
                            <div>
                                <input type="checkbox" name="alergia_intolerancia" value="outra">
                                <p>Outra</p>
                            </div>
                        </li>
                    </ul>
                    </div>
                </div>

            </div>

            <button class="btn w-full mt-12 bg-[#8C8C8C] border-[#8C8C8C] text-white hover:bg-[#7A7A7A]" type="submit">
                Salvar alterações
            </button>
    </form>
    <form action="{{url_for('user.delete_user', id_user=current_user.id)}}" method="post" class="mx-auto">
        <button type="submit" class="mt-[5px] cursor-pointer">Excluir conta</button>
    </form>
</div>
{% endblock %}
