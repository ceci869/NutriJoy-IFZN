{% extends 'base.html' %}
{% block content %}
    <a href="{{ url_for('restriction.get_restrictions') }}" class="p-4">
        <label class="btn btn-square btn-ghost bg-[#FEFAE6]">
                <!-- Sidebar toggle icon -->
                <i class="fa-solid fa-angles-left"></i>
        </label>
    </a>
    <h1 class="text-3xl font-semibold p-4">Cadastrar restrição</h1>
    <form action="{{ url_for('restriction.add_restriction') }}" method="post" class="w-full max-w-lg mx-auto flex flex-col">
        <label for="name" class="text-black text-[18px] mb-[5px] mt-[50px]">Digite o nome da restrição:</label>
        <input type="text" name="name" class="input input-bordered w-full">

        <button type="submit" class="btn mt-[15px] bg-[#5FB434] text-white">Cadastrar restrição</button>
    </form>
{% endblock %}
{% block styles %}
    <style>
        #item7{
            background-color: #FEF1AD;
        }
    </style>
{% endblock %}
