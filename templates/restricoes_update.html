<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update de Restrições</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#FEFAE6] h-[100vh]">
    <h1 class="text-3xl font-semibold p-4">Atualizar restrição</h1>
    <form action="{{ url_for('restriction.update_restriction', id_restriction=restriction.id) }}" method="post" class="w-full max-w-lg mx-auto flex flex-col">
        <label for="name" class="text-black text-[18px] mb-[5px] mt-[50px]">Digite o novo nome:</label>
        <input type="text" name="name" class="input input-bordered w-full">

        <button type="submit" class="btn mt-[15px] bg-[#5FB434] text-white">Salvar alteração</button>
    </form>
</body>
</html>
