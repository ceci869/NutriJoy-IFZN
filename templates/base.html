<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriJoy</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/dbda3eb66e.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Hind:wght@300;400;500;600;700&family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
    {% block styles %}
    {% endblock %}
</head>
<body class="font-[Inter]">
    <div class="drawer lg:drawer-open">
    <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content">
        <!-- Navbar -->
        <nav class="p-4 navbar w-full bg-[#FEFAE6] flex justify-between">
            <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost">
                <!-- Sidebar toggle icon -->
                <i class="fa-solid fa-angles-right"></i>
            </label>
            <img src="{{ url_for('static', filename='img/logo-nutrijoy.png') }}" alt="Logo do NutriJoy">
        </nav>
        {% block content2 %}
        {% endblock %}
        <!-- Page content here -->
        <main class="p-4">
            {% block content %}
                <h2>Catálogo de Receitas</h2>
            {% endblock %}
        </main>
    </div>

    <div class="drawer-side is-drawer-close:overflow-visible">
        <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
        <div class="flex p-4 min-h-full flex-col items-start bg-[#FEFAE6] is-drawer-close:w-14 is-drawer-open:w-64">
        <!-- Sidebar content here -->
        <ul class="menu w-full grow gap-[5px]">
            <!-- List item -->
            <li>
            <button id="item1" class="is-drawer-close:tooltip is-drawer-close:tooltip-right py-[12px] hover:bg-[#FEF1AD]" data-tip="Homepage">
                <!-- Home icon -->
                <a href="{{ url_for('homepage') }}" class="flex justify-baseline items-center">
                    <img src="{{ url_for('static', filename='img/home.svg') }}" alt="ìcone de casa" class="w-[30px]">
                    <span class="is-drawer-close:hidden ml-[10px] font-semibold text-[16px]">Página inicial</span>
                </a>
            </button>
            </li>

            <!-- List item -->
            <li>
            <button id="item2" class="is-drawer-close:tooltip is-drawer-close:tooltip-right py-[12px] hover:bg-[#FEF1AD]" data-tip="Receitas">
                <!-- Recipes icon -->
                <a href="{{ url_for('catalogodereceitas') }}" class="flex justify-baseline items-center">
                    <img src="{{ url_for('static', filename='img/cookie.svg') }}" alt="ìcone de cookie" class="w-[30px]">
                    <span class="is-drawer-close:hidden ml-[10px] font-semibold text-[16px]">Receitas</span>
                </a>
            </button>
            </li>

            <!-- List item -->
            <li>
            <button id="item3" class="is-drawer-close:tooltip is-drawer-close:tooltip-right py-[14px] hover:bg-[#FEF1AD]" data-tip="Cardápio semanal">
                <!-- Recipes icon -->
                <a href="{{ url_for('cardapiosemanal') }}" class="flex justify-baseline items-center">
                    <img src="{{ url_for('static', filename='img/lista.svg') }}" alt="ìcone de lista" class="w-[30px]">
                    <span class="is-drawer-close:hidden ml-[10px] font-semibold text-[16px]">Cardápio semanal</span>
                </a>
            </button>
            </li>

            <!-- List item -->
            <li>
            <button id="item4" class="is-drawer-close:tooltip is-drawer-close:tooltip-right py-[12px] hover:bg-[#FEF1AD]" data-tip="Perfil">
                <!-- Settings icon -->
                <a href="{{ url_for('gerenciarperfil') }}" class="flex justify-baseline items-center">
                    <img src="{{ url_for('static', filename='img/perfil.svg') }}" alt="ìcone de perfil" class="w-[30px]">
                    <span class="is-drawer-close:hidden ml-[10px] font-semibold text-[16px]">Perfil</span>
                </a>
            </button>
            </li>

            <!-- List item -->
            <li class="hover:bg-[#FEF1AD] rounded-[6px] py-[6px]">
            <form action="{{ url_for('user.logout') }}" method="POST" class="hover:bg-[#FEF1AD]">
                <button id="item5" class="is-drawer-close:tooltip is-drawer-close:tooltip-right cursor-pointer flex justify-baseline items-center hover:bg-[#FEF1AD]" data-tip="Logout">
        
                    <img src="{{ url_for('static', filename='img/sair.svg') }}" alt="ìcone de sair" class="w-[30px]">
                    <span class="is-drawer-close:hidden ml-[10px] font-semibold text-[16px]">Sair</span>

                </button>
            </form>
            </li>
        </ul>
        </div>
    </div>
    </div>
</body>
</html>
