<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar nutricionista | NutriJoy</title>
</head>
<body>
    <h1>Cadastrar nutricionista</h1>

    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
        <p>{{ mensagem }}</p>
    {% endfor %}

    <form method="POST" enctype="multipart/form-data">
        <label for="crn">CRN</label>
        <input type="number" id="crn" name="crn" required>

        <label for="name">Nome</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="specialization">Especialização</label>
        <input type="text" id="specialization" name="specialization">

        <label for="experience_years">Anos de experiência</label>
        <input type="number" id="experience_years" name="experience_years" min="0" required>

        <label for="profile_photo">Foto de perfil</label>
        <input type="file" id="profile_photo" name="profile_photo" accept="image/*" required>

        <label for="city">Cidade</label>
        <input type="text" id="city" name="city" required>

        <label for="state">Estado</label>
        <input type="text" id="state" name="state" required>

        <label for="university">Universidade</label>
        <input type="text" id="university" name="university" required>

        <label for="description">Descrição</label>
        <textarea id="description" name="description" required></textarea>

        <button type="submit">Cadastrar</button>
    </form>

    <a href="{{ url_for('nutritionist.admin_nutricionistas') }}">Voltar</a>
</body>
</html>
