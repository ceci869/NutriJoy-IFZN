{% extends 'base.html' %}
{% block content %}

    {% set mensagens = get_flashed_messages(with_categories=true) %} 
        {% if mensagens %}     
            {% for categoria, msg in mensagens %}
                <div class="alert alert-{{categoria}}" role="alert">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    <div class="pt-4 pl-4">
    <a href="{{ url_for('admin.admin_nutricionistas') }}">
        <label class="btn btn-square btn-ghost bg-[#FEFAE6]">
                <!-- Sidebar toggle icon -->
                <i class="fa-solid fa-angles-left"></i>
        </label>
    </a>
    </div>
    <h1 class="text-3xl font-semibold p-4">Editar nutricionista</h1>
    <form method="POST" enctype="multipart/form-data" action="{{ url_for('admin.admin_editar_nutricionista', crn=nutricionista.crn) }}" class="w-full max-w-lg mx-auto flex flex-col">
        <label for="name" class="text-black text-[18px] mb-[5px] mt-[50px]">Nome</label>
        <input type="text" id="name" name="name" placeholder="{{ nutricionista.name }}" class="text-gray-600 input input-bordered w-full">
        
        <label for="crn" class="text-black text-[18px] mb-[5px] mt-[20px]">CRN</label>
        <input type="text" id="crn" placeholder="{{ nutricionista.crn }}" disabled class="text-gray-600 input input-bordered w-full">

        <label for="email" class="text-black text-[18px] mb-[5px] mt-[20px]">Email</label>
        <input type="email" id="email" name="email" placeholder="{{ nutricionista.email }}" class="text-gray-600 input input-bordered w-full">

        <label for="specialization" class="text-black text-[18px] mb-[5px] mt-[20px]">Especialização</label>
        <input type="text" id="specialization" name="specialization" placeholder="{{ nutricionista.specialization or '' }}"  class="text-gray-600 input input-bordered w-full">

        <label for="experience_years" class="text-black text-[18px] mb-[5px] mt-[20px]">Anos de experiência</label>
        <input type="number" id="experience_years" name="experience_years" min="0" placeholder="{{ nutricionista.experience_years }}" class="text-gray-600 input input-bordered w-full">

        <label for="city" class="text-black text-[18px] mb-[5px] mt-[20px]">Cidade</label>
        <input type="text" id="city" name="city" placeholder="{{ nutricionista.city }}" class="text-gray-600 input input-bordered w-full">

        <label for="state" class="text-black text-[18px] mb-[5px] mt-[20px]">Estado</label>
        <input type="text" id="state" name="state" placeholder="{{ nutricionista.state }}" class=" text-gray-600 input input-bordered w-full">

        <label for="university" class="text-black text-[18px] mb-[5px] mt-[20px]">Universidade</label>
        <input type="text" id="university" name="university" placeholder="{{ nutricionista.university }}" class="text-gray-600 input input-bordered w-full">

        <label for="description" class="text-black text-[18px] mb-[5px] mt-[20px]">Descrição</label>
        <textarea id="description" name="description" placeholder="{{ nutricionista.description }}" class="input input-bordered w-full h-[80px] text-gray-600"></textarea>

        <div>
                    <h2 class="text-black text-[18px] mb-[5px] mt-[20px]">Alterar foto de perfil</h2>

                    <label
                        for="profile_photo"
                        class="flex items-center justify-center w-full max-w-[310px] h-[183px] border border-gray-300 cursor-pointer hover:bg-gray-50 transition-colors overflow-hidden"
                    >
                        <div
                            id="preview-container"
                            class="flex items-center justify-center w-full h-full"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="76"
                                height="76"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#D1D1D1"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect x="3" y="3" width="18" height="18" rx="0.5"/>
                                <circle cx="8.5" cy="8.5" r="1.8"/>
                                <path d="M21 15l-5-5L5 21"/>
                                <path d="M12 14l3-3 6 6"/>
                            </svg>
                        </div>

                        <input
                            type="file"
                            id="profile_photo"
                            name="profile_photo"
                            accept="image/*"
                            class="hidden"
                            onchange="mostrarFoto(event)"
                        >
                    </label>

                    <p id="nome-arquivo" class="text-sm text-gray-500 mt-3"></p>
                </div>

        <button type="submit" class="btn mt-[15px] bg-[#5FB434] text-white">Salvar alterações</button>
    </form>
<script>
        function avancar() {
            const etapa1 = document.getElementById('etapa1');
            const campos = etapa1.querySelectorAll('input[required]');

            for (const campo of campos) {
                if (!campo.checkValidity()) {
                    campo.reportValidity();
                    return;
                }
            }

            etapa1.classList.add('hidden');

            const etapa2 = document.getElementById('etapa2');
            etapa2.classList.remove('hidden');
            etapa2.classList.add('flex');

            document.querySelectorAll('#etapa2 input, #etapa2 textarea')
                .forEach(campo => campo.disabled = false);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function voltar() {
            const etapa2 = document.getElementById('etapa2');

            etapa2.classList.add('hidden');
            etapa2.classList.remove('flex');

            document.getElementById('etapa1').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function mostrarFoto(event) {
            const arquivo = event.target.files[0];
            const container = document.getElementById('preview-container');
            const nomeArquivo = document.getElementById('nome-arquivo');

            if (!arquivo) return;

            if (!arquivo.type.startsWith('image/')) {
                event.target.value = '';
                nomeArquivo.textContent = 'Selecione um arquivo de imagem válido.';
                return;
            }

            const imagem = document.createElement('img');
            imagem.src = URL.createObjectURL(arquivo);
            imagem.alt = 'Pré-visualização da foto de perfil';
            imagem.className = 'w-full h-full object-cover';

            container.replaceChildren(imagem);
            nomeArquivo.textContent = arquivo.name;
        }
    </script>
{% endblock %}
{% block styles %}
    <style>
        #item6{
            background-color: #FEF1AD;
        }
    </style>
{% endblock %}
